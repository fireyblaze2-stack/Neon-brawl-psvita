name: Vita prototype build

on:
  push:
    paths:
      - "vita/**"
      - ".github/workflows/vita-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect VitaSDK tools
        run: |
          echo "VITASDK=$VITASDK"
          echo "PATH=$PATH"
          for tool in arm-vita-eabi-gcc vita-makefself vita-mksfoex vita-pack-vpk; do
            if command -v "$tool"; then
              echo "FOUND: $tool"
            else
              echo "MISSING: $tool"
            fi
          done
          ls -la "$VITASDK/bin" 2>/dev/null || true
          ls -la "$VITASDK/arm-vita-eabi/bin" 2>/dev/null || true

      - name: Build native SDL2 prototype
        working-directory: vita
        run: |
          echo "Available Vita graphics/system libraries:"
          find "$VITASDK/arm-vita-eabi/lib" -maxdepth 1 -type f \\
            \( -iname '*vitaGL*' -o -iname '*Gles*' -o -iname '*EGL*' -o -iname '*MsgDialog*' -o -iname '*Ime*' -o -iname '*Motion*' -o -iname '*AudioIn*' \) \\
            -printf '%f\\n' | sort
          echo "SDL2 linker flags:"
          sdl2-config --static-libs || true
          arm-vita-eabi-gcc -Wall -O2 src/main.c -o neonbrawl.velf \\
            -I"$VITASDK/arm-vita-eabi/include/SDL2" \\
            -L"$VITASDK/arm-vita-eabi/lib" \\
            $(sdl2-config --static-libs)

      - name: Package prototype VPK
        working-directory: vita
        run: |
          mkdir -p package
          vita-makefself -c neonbrawl.velf package/eboot.bin
          vita-mksfoex -s TITLE_ID=NBRA00001 "Neon Brawl Vita Prototype" package/param.sfo
          vita-pack-vpk -s package/param.sfo -b package/eboot.bin neonbrawl-prototype.vpk

      - name: Upload prototype VPK
        uses: actions/upload-artifact@v4
        with:
          name: neonbrawl-vita-prototype
          path: vita/neonbrawl-prototype.vpk
