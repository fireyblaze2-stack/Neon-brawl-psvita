name: Vita prototype build

on:
  push:
    paths:
      - "vita/**"
      - ".github/workflows/vita-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect VitaSDK tools
        run: |
          echo "VITASDK=$VITASDK"
          for tool in arm-vita-eabi-gcc vita-make-fself vita-mksfoex vita-pack-vpk; do
            command -v "$tool" || true
          done

      - name: Build minimal native Vita executable
        working-directory: vita
        run: |
          arm-vita-eabi-gcc -Wall -O2 src/main.c -o neonbrawl.velf -I"$VITASDK/arm-vita-eabi/include" -L"$VITASDK/arm-vita-eabi/lib" -lSceKernel_stub

      - name: Package prototype VPK
        working-directory: vita
        run: |
          mkdir -p package
          vita-make-fself -c neonbrawl.velf package/eboot.bin
          vita-mksfoex -s TITLE_ID=NBRA00001 "Neon Brawl Vita Prototype" package/param.sfo
          vita-pack-vpk -s package/param.sfo -b package/eboot.bin neonbrawl-prototype.vpk

      - name: Upload prototype VPK
        uses: actions/upload-artifact@v4
        with:
          name: neonbrawl-vita-prototype
          path: vita/neonbrawl-prototype.vpk
