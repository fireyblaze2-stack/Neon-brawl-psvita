name: Vita prototype build

on:
  push:
    paths:
      - "vita/**"
      - ".github/workflows/vita-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect VitaSDK tools and libraries
        run: |
          echo "VITASDK=$VITASDK"
          command -v arm-vita-eabi-gcc
          command -v vita-make-fself
          command -v vita-mksfoex
          command -v vita-pack-vpk
          find "$VITASDK/arm-vita-eabi/lib" -maxdepth 1 -name 'lib*Sce*_stub.a' -printf '%f\\n' | sort

      - name: Build SDL2 Vita executable
        working-directory: vita
        run: |
          arm-vita-eabi-gcc -Wall -O2 -Wl,-q \
            -I"$VITASDK/arm-vita-eabi/include" \
            src/main.c -o neonbrawl.velf \
            -L"$VITASDK/arm-vita-eabi/lib" \
            -lSDL2 -lm \
            -Wl,--start-group \
            -lSceKernel_stub -lSceDisplay_stub -lSceGxm_stub \
            -lSceSysmodule_stub -lSceCtrl_stub -lSceTouch_stub \
            -Wl,--end-group

      - name: Package prototype VPK
        working-directory: vita
        run: |
          mkdir -p package
          vita-make-fself -c neonbrawl.velf package/eboot.bin
          vita-mksfoex -s TITLE_ID=NBRA00001 "Neon Brawl Vita Prototype" package/param.sfo
          vita-pack-vpk -s package/param.sfo -b package/eboot.bin neonbrawl-prototype.vpk

      - name: Verify VPK exists
        working-directory: vita
        run: test -s neonbrawl-prototype.vpk

      - name: Upload prototype VPK
        uses: actions/upload-artifact@v4
        with:
          name: neonbrawl-vita-prototype
          path: vita/neonbrawl-prototype.vpk
